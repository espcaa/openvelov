name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Debug build & unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up jdk 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up android sdk
        uses: android-actions/setup-android@v4

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          velovClientKey=${{ secrets.VELOV_CLIENT_KEY }}
          velovRefreshToken=${{ secrets.VELOV_REFRESH_TOKEN }}
          releaseStoreFile=${{ secrets.RELEASE_STORE_FILE }}
          releaseStorePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          releaseKeyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          releaseKeyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build debug apk and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  release:
    name: Release build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up jdk 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up android sdk
        uses: android-actions/setup-android@v4

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          velovClientKey=${{ secrets.VELOV_CLIENT_KEY }}
          velovRefreshToken=${{ secrets.VELOV_REFRESH_TOKEN }}
          releaseStoreFile=${{ secrets.RELEASE_STORE_FILE }}
          releaseStorePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          releaseKeyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          releaseKeyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build release apk
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release apk
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
